name: Workflow Lint

on:
  # `actionlint` is a required status check. Path filters skip this workflow
  # without reporting that check, which blocks pull requests that do not
  # change workflow files. Keep both triggers unfiltered and let the job run
  # `make workflow-tools` and `make workflow-check`.
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned actionlint
        run: make workflow-tools

      - name: Lint GitHub workflows
        run: make workflow-check
