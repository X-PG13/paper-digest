[app]
timezone = "Asia/Shanghai"
lookback_hours = 24
output_dir = "output"
request_delay_seconds = 3
request_timeout_seconds = 60
fetch_retry_attempts = 4
fetch_retry_backoff_seconds = 10

[state]
enabled = true
path = ".paper-digest-state/state.json"
retention_days = 90

[feedback]
enabled = true
path = ".paper-digest-state/feedback.json"

[digest]
template = "zh_daily_brief"
top_highlights = 5
feed_key_points = 5

[ranking]
sort_by = "hybrid"

[translation]
enabled = true
provider = "argos"
model_path = ".paper-digest-models/argos-en-zh-1.9"
max_papers = 32
max_summary_chars = 600
fail_on_error = false

[analysis]
enabled = false
provider = "openai"
model = "gpt-5-mini"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1/responses"
timeout_seconds = 60
max_papers = 32
max_output_tokens = 700
language = "Chinese"
reasoning_effort = "minimal"
fail_on_error = false

[[feeds]]
name = "LLM"
source = "arxiv"
categories = ["cs.CL", "cs.AI", "cs.LG"]
keywords = [
  "language model",
  "large language model",
  "LLM",
  "language-model",
  "reasoning model",
  "alignment",
  "instruction tuning",
  "in-context learning",
  "retrieval augmented generation",
  "RAG",
  "multimodal language model",
  "foundation model",
  "post-training",
  "pretraining",
]
exclude_keywords = [
  "survey",
  "tutorial",
  "position paper",
  "security",
  "prompt injection",
  "jailbreak",
  "vulnerability",
  "adversarial attack",
  "malware",
  "software engineering",
  "SWE-bench",
  "coding agent",
  "program repair",
  "agent benchmark",
  "agent evaluation",
  "coding benchmark",
  "coding agent evaluation",
  "Terminal-Bench",
  "terminal agent",
]
max_results = 100
max_items = 10

